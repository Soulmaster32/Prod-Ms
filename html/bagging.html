<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MS Product Bagging</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Inherited CSS Variables & Base Styles */
    :root {
      --bg: #0a0f1c; --panel: #131b2e; --panel-2: #1c2740; --line: #2a3752;
      --text: #f1f5f9; --muted: #8b98b3; --accent: #22d3ee; --accent-2: #0891b2;
      --violet: #a78bfa; --amber: #fbbf24; --ok: #34d399; --danger: #f87171;
      --shadow: 0 24px 48px -18px rgba(0, 0, 0, 0.6); --glass: rgba(19, 27, 46, 0.72);
      --radius-lg: 18px; --radius-md: 12px; --radius-sm: 8px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; font-family: 'Inter', sans-serif;
      background: radial-gradient(ellipse 900px 500px at 10% -5%, rgba(34,211,238,0.14), transparent 55%),
                  radial-gradient(ellipse 700px 500px at 95% 15%, rgba(167,139,250,0.08), transparent 55%),
                  var(--bg);
      background-attachment: fixed; color: var(--text);
      min-height: 100vh; padding-bottom: 96px; -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 1400px; margin: 0 auto; padding: 32px 20px; }

    header.page-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
    .title-block { display: flex; align-items: center; gap: 14px; }
    .title-icon {
      width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0;
      background: linear-gradient(135deg, rgba(167,139,250,0.18), rgba(124,58,237,0.1));
      border: 1px solid rgba(167,139,250,0.25); display: grid; place-items: center;
      box-shadow: 0 8px 20px -6px rgba(167,139,250,0.3);
    }
    .title-icon i { font-size: 22px; color: var(--violet); }
    h1 { margin: 0 0 4px; font-size: 27px; font-weight: 800; letter-spacing: -0.6px; }
    .sub { color: var(--muted); font-size: 14px; }

    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button {
      border: 0; border-radius: 10px; padding: 10px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer;
      color: white; background: var(--panel-2); transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-primary { background: linear-gradient(135deg, var(--violet), #7c3aed); box-shadow: 0 6px 16px -4px rgba(167,139,250,0.4); }
    .btn-ghost { background: rgba(255,255,255,0.04); border: 1px solid rgba(148,163,184,0.25); color: var(--text); }
    .btn-danger { background: rgba(248, 113, 113, 0.12); color: #fca5a5; border: 1px solid rgba(248, 113, 113, 0.28); }
    button:hover { transform: translateY(-1px); filter: brightness(1.1); }

    .card {
      background: var(--glass); backdrop-filter: blur(14px); border: 1px solid rgba(148,163,184,0.14);
      border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 22px;
    }
    .chart-card-header { display: flex; justify-content: space-between; padding: 20px 24px 4px; }
    .chart-card-header h3 { margin: 0; font-size: 15px; font-weight: 700; color: var(--violet); }
    .chart-container { padding: 8px 20px 22px; width: 100%; height: 340px; }

    .table-wrap { width: 100%; overflow-x: auto; max-height: 700px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 1200px; }
    th, td { padding: 15px 20px; border-bottom: 1px solid rgba(148,163,184,0.08); text-align: left; vertical-align: middle; }
    th { background: rgba(10, 15, 28, 0.96); color: #8b98b3; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; position: sticky; top: 0; z-index: 10; }
    td { font-size: 13.5px; }
    tbody tr:hover td { background: rgba(167,139,250, 0.06); }

    .data-stack { display: flex; flex-direction: column; gap: 4px; }
    .data-label { font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 600; }
    .data-val { font-size: 14px; font-weight: 500; color: white; }

    .badge-status { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px;}
    .status-ok { background: rgba(52,211,153,0.15); color: var(--ok); }
    .status-no { background: rgba(248,113,113,0.15); color: var(--danger); }
    .cond-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

    .badge-shift { padding: 3px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; background: rgba(34,211,238,0.15); color: var(--accent); display: inline-block; margin-top:4px;}

    .modal-bg { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.72); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s; padding:16px;}
    .modal-bg.show { opacity: 1; pointer-events: auto; }
    .modal { width: min(850px, 100%); background: var(--panel); border: 1px solid rgba(148,163,184,0.16); border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); max-height: 92vh; display: flex; flex-direction: column; }
    .modal header { padding: 24px; border-bottom: 1px solid rgba(148,163,184,0.1); display: flex; align-items: center; gap: 12px; }
    .modal header h2 { margin: 0; font-size: 21px; font-weight: 700; }
    .modal .body { padding: 24px; overflow-y: auto; flex: 1; }
    .modal footer { padding: 20px 24px; border-top: 1px solid rgba(148,163,184,0.1); display: flex; justify-content: flex-end; gap: 12px; background: rgba(10, 15, 28, 0.4); }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .full { grid-column: 1 / -1; }
    
    .top-log { background: rgba(167,139,250,0.05); padding: 16px; border-radius: 12px; border: 1px dashed rgba(167,139,250,0.3); margin-bottom: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;}
    .top-log label { color: var(--violet); }

    label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
    input, select { width: 100%; padding: 13px 15px; border-radius: 10px; border: 1px solid rgba(148,163,184,0.25); background: rgba(10, 15, 28, 0.8); color: white; outline: none; font-size: 14px;}
    input:focus { border-color: var(--violet); }

    .checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px;}
    .check-item { display: flex; align-items: center; gap: 10px; background: rgba(10, 15, 28, 0.5); padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(148,163,184,0.15); cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s;}
    .check-item:hover { border-color: var(--violet); }
    .check-item input { width: 18px; height: 18px; margin: 0; cursor: pointer; accent-color: var(--violet); }

    .multi-thumb-container { display: flex; gap: 8px; }
    .thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 9px; border: 1px solid rgba(148,163,184,0.25); cursor: pointer; position: relative;}
    .no-img { width: 45px; height: 45px; border-radius: 9px; display: grid; place-items: center; background: rgba(15, 23, 42, 0.5); color: var(--muted); border: 1px dashed rgba(148,163,184,0.3); font-size: 18px;}

    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 10px;}
    .file-upload-wrapper { position: relative; height: 80px;}
    .file-upload-wrapper input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 2;}
    .file-upload-ui { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 100%; border: 2px dashed rgba(148,163,184,0.28); border-radius: 10px; background: rgba(10, 15, 28, 0.5); color: var(--muted); font-weight: 500; font-size: 12px; text-align: center; padding: 10px;}

    @media (max-width: 768px) {
      .grid, .top-log, .checklist, .photo-grid { grid-template-columns: 1fr; }
      .modal { border-radius: 24px 24px 0 0; max-height: 90vh; transform: translateY(100%); }
      .modal-bg.show .modal { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="page-header">
      <div class="title-block">
        <div class="title-icon"><i class="fa-solid fa-box-open"></i></div>
        <div>
          <h1>MS Product Bagging</h1>
          <div class="sub">Log Weights, Conditions, and Track End-of-Shift Totals.</div>
        </div>
      </div>
      <div class="toolbar">
        <button class="btn-ghost" type="button" onclick="window.history.back()">
          <i class="fa-solid fa-arrow-left"></i> Back
        </button>
        <button class="btn-primary" type="button" onclick="openForm()">
          <i class="fa-solid fa-plus"></i> Add Bagging Record
        </button>
      </div>
    </header>

    <!-- End of Shift Chart Card -->
    <div class="card" id="chartCard">
      <div class="chart-card-header">
        <h3><i class="fa-solid fa-chart-line"></i> End of Shift Totals</h3>
      </div>
      <div class="chart-container">
        <canvas id="shiftChart"></canvas>
      </div>
    </div>

    <!-- Data Table -->
    <div class="card">
      <div class="chart-card-header">
        <h3 style="color:var(--text)"><i class="fa-solid fa-list"></i> Detailed Records</h3>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th><i class="fa-solid fa-camera"></i> Photos (Bag/QA/Bagger)</th>
              <th><i class="fa-solid fa-cube"></i> Product & Shift</th>
              <th><i class="fa-solid fa-users"></i> Personnel</th>
              <th><i class="fa-solid fa-scale-balanced"></i> Weights Logging</th>
              <th><i class="fa-solid fa-clipboard-check"></i> Conditions</th>
              <th style="text-align: center;"><i class="fa-solid fa-wrench"></i> Actions</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <!-- Populated via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Form Modal -->
  <div class="modal-bg" id="formModal">
    <div class="modal">
      <header>
        <i class="fa-solid fa-pen-to-square" style="color:var(--violet)"></i>
        <h2 id="formTitle">Add Bagging Record</h2>
      </header>
      <div class="body">
        <form id="recordForm">
          <input type="hidden" id="recordId" />
          
          <div class="top-log">
            <div>
              <label for="weighingScale"><i class="fa-solid fa-scale-balanced"></i> Weighing Scale (kg)</label>
              <input id="weighingScale" type="number" step="0.01" required placeholder="0.00" />
            </div>
            <div>
              <label for="tareWeight"><i class="fa-solid fa-minus"></i> Tare Weight (kg)</label>
              <input id="tareWeight" type="number" step="0.01" required placeholder="0.00" />
            </div>
            <div>
              <label for="bagWeight" style="color:var(--accent);"><i class="fa-solid fa-weight-hanging"></i> Weight of the Bag (kg)</label>
              <input id="bagWeight" type="number" step="0.01" required placeholder="0.00" />
            </div>
          </div>

          <div class="grid">
            <div>
              <label for="productName"><i class="fa-solid fa-cube"></i> Product Name</label>
              <input id="productName" type="text" required placeholder="Enter Product Name" />
            </div>
            <div style="display: flex; gap:10px;">
              <div style="flex:1;">
                <label for="bagDate"><i class="fa-regular fa-calendar"></i> Date</label>
                <input id="bagDate" type="date" required />
              </div>
              <div style="flex:1;">
                <label for="bagTime"><i class="fa-regular fa-clock"></i> Time</label>
                <input id="bagTime" type="time" required />
              </div>
            </div>

            <div>
              <label for="qaPerson"><i class="fa-solid fa-clipboard-user"></i> Q.A Person</label>
              <input id="qaPerson" type="text" required placeholder="Name of QA" />
            </div>
            <div>
              <label for="assignPerson"><i class="fa-solid fa-user-gear"></i> Bagger Assign</label>
              <input id="assignPerson" type="text" required placeholder="Name of Bagger" />
            </div>
            
            <div class="full">
              <label><i class="fa-solid fa-clipboard-check"></i> Check Conditions</label>
              <div class="checklist">
                <label class="check-item"><input type="checkbox" id="chkTie"> Tie</label>
                <label class="check-item"><input type="checkbox" id="chkSling"> Sling</label>
                <label class="check-item"><input type="checkbox" id="chkWriting"> Writing Back and Front</label>
                <label class="check-item"><input type="checkbox" id="chkN2"> N2 Purging</label>
                <label class="check-item"><input type="checkbox" id="chkRedTag"> Before removing red tag sling install</label>
                <label class="check-item"><input type="checkbox" id="chkWarehouse"> Deliver to Warehouse</label>
              </div>
            </div>

            <div class="full">
              <label><i class="fa-solid fa-camera"></i> Attached Evidence Photos</label>
              <div class="photo-grid">
                <div>
                  <div class="file-upload-wrapper">
                    <input type="file" id="photoBag" accept="image/*" />
                    <div class="file-upload-ui" id="uiPhotoBag">
                      <i class="fa-solid fa-box-open" style="font-size: 20px;"></i>
                      <span>Image of Bag</span>
                    </div>
                  </div>
                </div>
                <div>
                  <div class="file-upload-wrapper">
                    <input type="file" id="photoQA" accept="image/*" />
                    <div class="file-upload-ui" id="uiPhotoQA">
                      <i class="fa-solid fa-clipboard-user" style="font-size: 20px;"></i>
                      <span>Image of QA</span>
                    </div>
                  </div>
                </div>
                <div>
                  <div class="file-upload-wrapper">
                    <input type="file" id="photoBagger" accept="image/*" />
                    <div class="file-upload-ui" id="uiPhotoBagger">
                      <i class="fa-solid fa-user-gear" style="font-size: 20px;"></i>
                      <span>Image of Bagger</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
      <footer>
        <button class="btn-ghost" type="button" onclick="closeForm()">Cancel</button>
        <button class="btn-primary" type="button" onclick="saveRecord()"><i class="fa-solid fa-floppy-disk"></i> Save Record</button>
      </footer>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "ms_product_bagging_v2";
    let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    let chartInstance = null;

    let pendingImages = { bag: null, qa: null, bagger: null };

    // Function to calculate Shift from time
    function calculateShift(timeStr) {
      if (!timeStr) return 'Unknown Shift';
      const h = parseInt(timeStr.split(':')[0]);
      if (h >= 7 && h < 15) return '1st Shift';
      if (h >= 15 && h < 23) return '2nd Shift';
      return '3rd Shift';
    }

    // Image Compressor Helper
    function setupImageUpload(inputId, uiId, key) {
      document.getElementById(inputId).addEventListener("change", function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const MAX = 500;
            let w = img.width, h = img.height;
            if(w > h && w > MAX) { h *= MAX/w; w = MAX; }
            else if (h > MAX) { w *= MAX/h; h = MAX; }
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            pendingImages[key] = canvas.toDataURL("image/jpeg", 0.7);
            document.getElementById(uiId).innerHTML = `<i class="fa-solid fa-circle-check" style="color:var(--ok); font-size:24px;"></i><span style="color:var(--ok)">Attached</span>`;
            document.getElementById(uiId).style.borderColor = "var(--ok)";
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    setupImageUpload("photoBag", "uiPhotoBag", "bag");
    setupImageUpload("photoQA", "uiPhotoQA", "qa");
    setupImageUpload("photoBagger", "uiPhotoBagger", "bagger");

    function renderTable() {
      const tbody = document.getElementById("tbody");
      tbody.innerHTML = "";

      if(records.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:40px; color:var(--muted);">No bagging records found.</td></tr>`;
        document.getElementById("chartCard").style.display = "none";
        return;
      }
      document.getElementById("chartCard").style.display = "block";

      const sorted = [...records].sort((a, b) => new Date(b.date + 'T' + b.time) - new Date(a.date + 'T' + a.time));

      sorted.forEach(r => {
        const netWeight = (parseFloat(r.scale) - parseFloat(r.tare)).toFixed(2);
        const bagWt = r.bagWeight ? parseFloat(r.bagWeight).toFixed(2) : '-';
        const shiftStr = calculateShift(r.time);
        
        const cond = (c, label) => c ? `<span class="badge-status status-ok"><i class="fa-solid fa-check"></i> ${label}</span>` : `<span class="badge-status status-no"><i class="fa-solid fa-xmark"></i> ${label}</span>`;
        
        const renderThumb = (imgSrc, title) => imgSrc ? `<img class="thumb" src="${imgSrc}" title="${title}">` : `<div class="no-img" title="No ${title}"><i class="fa-solid fa-user-slash" style="font-size:14px"></i></div>`;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>
            <div class="multi-thumb-container">
               ${r.photoBag ? `<img class="thumb" src="${r.photoBag}" title="Bag Image">` : `<div class="no-img" title="No Bag Photo"><i class="fa-regular fa-image"></i></div>`}
               ${renderThumb(r.photoQA, 'QA Image')}
               ${renderThumb(r.photoBagger, 'Bagger Image')}
            </div>
          </td>
          <td>
            <div class="data-stack">
              <span class="data-val" style="color:var(--violet); font-weight:700;">${r.productName}</span>
              <span class="data-label">${r.date} · ${r.time}</span>
              <span class="badge-shift">${shiftStr}</span>
            </div>
          </td>
          <td>
             <div class="data-stack">
               <div><span class="data-label">QA:</span> <span class="data-val">${r.qaPerson || 'N/A'}</span></div>
               <div><span class="data-label">Bagger:</span> <span class="data-val">${r.person}</span></div>
             </div>
          </td>
          <td>
             <div class="data-stack">
               <div><span class="data-label">Scale:</span> <span class="data-val">${r.scale} kg</span></div>
               <div><span class="data-label">Tare:</span> <span class="data-val">${r.tare} kg</span></div>
               <div><span class="data-label">Bag Wt:</span> <span class="data-val" style="color:var(--accent); font-weight:bold">${bagWt} kg</span></div>
               <div style="margin-top:2px"><span class="data-label">Net:</span> <span class="data-val">${netWeight} kg</span></div>
             </div>
          </td>
          <td>
            <div class="cond-grid">
              ${cond(r.condTie, 'Tie')}
              ${cond(r.condSling, 'Sling')}
              ${cond(r.condWriting, 'Writing')}
              ${cond(r.condN2, 'N2')}
              ${cond(r.condRedTag, 'Tag')}
              ${cond(r.condWarehouse, 'Whse')}
            </div>
          </td>
          <td style="text-align: center;">
            <button class="btn-danger" style="padding:8px 12px;" onclick="deleteRecord('${r.id}')"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      renderShiftChart(sorted);
    }

    function renderShiftChart(data) {
      const ctx = document.getElementById('shiftChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      // Aggregate data by Date + Shift
      const grouped = {};
      
      // Sort oldest to newest for timeline tracking
      const chronological = [...data].sort((a, b) => new Date(a.date + 'T' + a.time) - new Date(b.date + 'T' + b.time));

      chronological.forEach(r => {
        const shiftStr = calculateShift(r.time);
        const key = `${r.date} - ${shiftStr}`;
        if (!grouped[key]) {
          grouped[key] = { bagCount: 0, totalWeight: 0 };
        }
        grouped[key].bagCount += 1;
        // Total weight logic: Will sum the inputted 'Weight of the Bag' or fallback to Net Weight
        const w = parseFloat(r.bagWeight) || (parseFloat(r.scale) - parseFloat(r.tare)) || 0;
        grouped[key].totalWeight += w;
      });

      const labels = Object.keys(grouped);
      const counts = labels.map(l => grouped[l].bagCount);
      const weights = labels.map(l => grouped[l].totalWeight.toFixed(2));

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Total Bags (Count)',
              data: counts,
              backgroundColor: 'rgba(167, 139, 250, 0.8)',
              borderColor: '#a78bfa',
              borderWidth: 1,
              borderRadius: 6,
              yAxisID: 'y'
            },
            {
              label: 'Total Weight (kg)',
              data: weights,
              type: 'line',
              backgroundColor: '#22d3ee',
              borderColor: '#22d3ee',
              borderWidth: 3,
              pointRadius: 4,
              pointBackgroundColor: '#131b2e',
              tension: 0.3,
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { labels: { color: '#e2e8f0', usePointStyle: true, padding: 15 } }
          },
          scales: {
            x: { 
              ticks: { color: '#8b98b3', font: {size: 11} }, 
              grid: { color: 'rgba(148,163,184,0.05)' } 
            },
            y: { 
              type: 'linear', position: 'left',
              title: { display: true, text: 'Total Bags (Count)', color: '#a78bfa', font: {weight: 'bold'} },
              ticks: { color: '#8b98b3', stepSize: 1 }, 
              grid: { color: 'rgba(148,163,184,0.1)' }, 
              beginAtZero: true 
            },
            y1: {
              type: 'linear', position: 'right',
              title: { display: true, text: 'Total Weight (kg)', color: '#22d3ee', font: {weight: 'bold'} },
              ticks: { color: '#8b98b3' },
              grid: { drawOnChartArea: false },
              beginAtZero: true
            }
          }
        }
      });
    }

    function resetUploadUI(id, icon, text) {
      document.getElementById(id).value = "";
      document.getElementById("ui" + id.charAt(0).toUpperCase() + id.slice(1)).innerHTML = `<i class="fa-solid ${icon}" style="font-size: 20px;"></i><span>${text}</span>`;
      document.getElementById("ui" + id.charAt(0).toUpperCase() + id.slice(1)).style.borderColor = "rgba(148,163,184,0.28)";
    }

    function openForm() {
      document.getElementById("recordForm").reset();
      
      pendingImages = { bag: null, qa: null, bagger: null };
      resetUploadUI("photoBag", "fa-box-open", "Image of Bag");
      resetUploadUI("photoQA", "fa-clipboard-user", "Image of QA");
      resetUploadUI("photoBagger", "fa-user-gear", "Image of Bagger");
      
      const now = new Date();
      document.getElementById("bagDate").value = now.toISOString().slice(0, 10);
      document.getElementById("bagTime").value = now.toTimeString().slice(0, 5);
      
      document.getElementById("formModal").classList.add("show");
    }

    function closeForm() {
      document.getElementById("formModal").classList.remove("show");
    }

    function saveRecord() {
      const form = document.getElementById("recordForm");
      if (!form.reportValidity()) return;

      const record = {
        id: crypto.randomUUID(),
        scale: document.getElementById("weighingScale").value,
        tare: document.getElementById("tareWeight").value,
        bagWeight: document.getElementById("bagWeight").value,
        productName: document.getElementById("productName").value,
        qaPerson: document.getElementById("qaPerson").value,
        person: document.getElementById("assignPerson").value,
        date: document.getElementById("bagDate").value,
        time: document.getElementById("bagTime").value,
        condTie: document.getElementById("chkTie").checked,
        condSling: document.getElementById("chkSling").checked,
        condWriting: document.getElementById("chkWriting").checked,
        condN2: document.getElementById("chkN2").checked,
        condRedTag: document.getElementById("chkRedTag").checked,
        condWarehouse: document.getElementById("chkWarehouse").checked,
        photoBag: pendingImages.bag,
        photoQA: pendingImages.qa,
        photoBagger: pendingImages.bagger
      };

      records.push(record);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      renderTable();
      closeForm();
    }

    function deleteRecord(id) {
      if(!confirm("Delete this bagging log?")) return;
      records = records.filter(r => r.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      renderTable();
    }

    // Initialize
    renderTable();
  </script>
</body>
</html>
